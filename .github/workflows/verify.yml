name: Verify

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  plugin-check:
    name: Gradle ${{ matrix.gradle }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle: [ "8.12.1", "9.7.1" ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: gradle check --configuration-cache --no-daemon
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-results-gradle-${{ matrix.gradle }}
          path: |
            build/test-results/**
            build/reports/**
          if-no-files-found: ignore

  github-action-check:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --prefix github-action
      - name: Test action
        run: npm test --prefix github-action

  dependency-locks:
    name: Dependency locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify dependency locks are current
        run: |
          ./gradlew dependencies --write-locks --no-daemon
          git diff --exit-code -- gradle.lockfile build-logic/gradle.lockfile build-logic/settings-gradle.lockfile settings-gradle.lockfile
